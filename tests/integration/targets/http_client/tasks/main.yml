# Integration target: the shipped http transport through a real task on this
# ansible-core version, against a scripted loopback server in a separate
# process.
#
# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later

---
- name: "Run the http_client target"
  block:
    - name: "Create the server state directory"
      ansible.builtin.tempfile:
        state: "directory"
        suffix: "-foundata-utils-http"
      register: __http_client_state

    - name: "Start the scripted loopback server"
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter | ansible.builtin.default('python3') }}"
          - "{{ role_path }}/files/loopback_server.py"
          - "{{ __http_client_state['path'] }}"
          - "120"
      async: 150
      poll: 0
      changed_when:
        - false
      register: __http_client_server

    - name: "Wait for the server to publish its port"
      ansible.builtin.wait_for:
        path: "{{ __http_client_state['path'] }}/port"
        timeout: 30

    - name: "Read the server port"
      ansible.builtin.slurp:
        src: "{{ __http_client_state['path'] }}/port"
      register: __http_client_port

    - name: "Set the endpoint URL"
      ansible.builtin.set_fact:
        __http_client_url: "http://127.0.0.1:{{ __http_client_port['content'] | ansible.builtin.b64decode }}"

    - name: "Request a successful JSON response"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/ok?x=1"
        token: "SYNTHETIC-SECRET-integration-9c4d"
        return_body: true
        deadline: 10
      register: __http_client_ok

    - name: "Verify the successful response"
      ansible.builtin.assert:
        that:
          - "__http_client_ok is not ansible.builtin.changed"
          - "__http_client_ok['status'] == 200"
          - "__http_client_ok['headers']['content-type'] == 'application/json'"
          - "(__http_client_ok['body'] | ansible.builtin.from_json)['target'] == '/ok?x=1'"
          - "(__http_client_ok['body'] | ansible.builtin.from_json)['authenticated'] is ansible.builtin.true"
          - "'SYNTHETIC-SECRET' not in (__http_client_ok | ansible.builtin.to_json)"

    - name: "Request an error status with a body"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/error"
        return_body: true
        deadline: 10
      register: __http_client_error

    - name: "Verify the error status is a response, not a failure"
      ansible.builtin.assert:
        that:
          - "__http_client_error is not ansible.builtin.failed"
          - "__http_client_error['status'] == 500"
          - "(__http_client_error['body'] | ansible.builtin.from_json)['result'] == 'failed'"

    - name: "Request an endpoint that echoes the credential"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/echo"
        token: "SYNTHETIC-SECRET-integration-9c4d"
        deadline: 10
      register: __http_client_echo

    - name: "Verify the echoed credential stays inside the module"
      ansible.builtin.assert:
        that:
          - "__http_client_echo['status'] == 401"
          - "'SYNTHETIC-SECRET' not in (__http_client_echo | ansible.builtin.to_json)"

    - name: "Request an empty response"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/empty"
        return_body: true
        deadline: 10
      register: __http_client_empty

    - name: "Verify the empty response"
      ansible.builtin.assert:
        that:
          - "__http_client_empty['status'] == 204"
          - "__http_client_empty['body'] == ''"

    - name: "Request a cross-origin redirect"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/redirect"
        deadline: 10
      register: __http_client_redirect

    - name: "Verify the redirect is returned and not followed"
      ansible.builtin.assert:
        that:
          - "__http_client_redirect['status'] == 302"
          - "__http_client_redirect['headers']['location'] == 'http://127.0.0.2:9/login'"

    - name: "Request an oversized response"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/oversized"
        max_body_bytes: 1048576
        deadline: 10
      ignore_errors: true
      register: __http_client_oversized

    - name: "Request a compressed response"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/compressed"
        deadline: 10
      ignore_errors: true
      register: __http_client_compressed

    - name: "Request a stalled response"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/stall"
        timeout: 1
        deadline: 10
      ignore_errors: true
      register: __http_client_stall

    - name: "Request a trickled body"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/trickle"
        timeout: 5
        deadline: 2
      ignore_errors: true
      register: __http_client_trickle

    - name: "Request with an invalid deadline"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/ok"
        deadline: 0
        token: "SYNTHETIC-SECRET-integration-9c4d"
      ignore_errors: true
      register: __http_client_bad_deadline

    - name: "Request with a credential that holds a line break"
      http_probe:
        url: "{{ __http_client_url }}"
        path: "/ok"
        token: "SYNTHETIC-SECRET-integration-9c4d\nX-Injected: 1"
        deadline: 10
      ignore_errors: true
      register: __http_client_bad_token

    - name: "Request an endpoint whose host has an empty label"
      http_probe:
        url: "http://zammad..example.invalid"
        path: "/ok"
        deadline: 10
      ignore_errors: true
      register: __http_client_bad_host

    - name: "Verify the option values fail as argument errors before any request"
      ansible.builtin.assert:
        that:
          - "__http_client_bad_token is ansible.builtin.failed"
          - "__http_client_bad_token is not ansible.builtin.changed"
          - "__http_client_bad_token['outcome'] == 'unchanged'"
          - "__http_client_bad_token['error_category'] == 'argument'"
          - "__http_client_bad_token['error_code'] == 'invalid_header'"
          - "'SYNTHETIC-SECRET' not in (__http_client_bad_token | ansible.builtin.to_json)"
          - "__http_client_bad_host['outcome'] == 'unchanged'"
          - "__http_client_bad_host['error_category'] == 'argument'"
          - "__http_client_bad_host['error_code'] == 'invalid_url'"

    - name: "Verify the failures carry safe shared codes"
      ansible.builtin.assert:
        that:
          - "__http_client_oversized is ansible.builtin.failed"
          - "__http_client_oversized['error_category'] == 'response'"
          - "__http_client_oversized['error_code'] == 'body_too_large'"
          - "__http_client_oversized['outcome'] == 'unchanged'"
          - "__http_client_oversized['msg'] == 'The probe request failed'"
          - "__http_client_compressed['error_code'] == 'content_encoding'"
          - "__http_client_stall['error_category'] == 'timeout'"
          - "__http_client_stall['error_code'] == 'socket_timeout'"
          - "__http_client_stall['elapsed'] | ansible.builtin.float < 3"
          - "__http_client_trickle['error_code'] == 'deadline_exceeded'"
          - "__http_client_trickle['elapsed'] | ansible.builtin.float < 3"
          - "__http_client_bad_deadline['error_category'] == 'argument'"
          - "__http_client_bad_deadline['error_code'] == 'invalid_deadline'"
          - "'scripted failure' not in (__http_client_oversized | ansible.builtin.to_json)"

    - name: "Verify controller-visible results exclude private secrets and protocol fields"
      ansible.builtin.assert:
        that:
          - "'_ansible_new_secrets' not in item"
          - "'SYNTHETIC-SECRET' not in (item | ansible.builtin.to_json)"
      loop:
        - "{{ __http_client_ok }}"
        - "{{ __http_client_echo }}"
        - "{{ __http_client_bad_deadline }}"
  always:
    - name: "Read the server process ID"
      ansible.builtin.slurp:
        src: "{{ __http_client_state['path'] }}/pid"
      failed_when:
        - false
      register: __http_client_pid

    - name: "Stop the scripted loopback server"
      ansible.builtin.command:
        argv:
          - "kill"
          - "{{ __http_client_pid['content'] | ansible.builtin.b64decode }}"
      when:
        - "__http_client_pid['content'] is ansible.builtin.defined"
      changed_when:
        - false
      failed_when:
        - false

    - name: "Remove the server state directory"
      ansible.builtin.file:
        path: "{{ __http_client_state['path'] }}"
        state: "absent"
      when:
        - "__http_client_state['path'] is ansible.builtin.defined"
